spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Custom constants for lines
notification:
  rabbitmq:
    exchange: notification.exchange
    routing-key: notification.routingKey
    queue: notification.queue
    dlq-exchange: notification.dlq.exchange
    dlq-routing-key: notification.dlq.routingKey
    dlq-queue: notification.dlq.queue